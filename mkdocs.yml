site_name: EEPROM Lab | База Знаний
site_description: Инженерная база знаний: ремонт электроники, микроконтроллеры, самоделки
site_author: Aydin

theme:
  name: material
  language: ru
  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/lightbulb-outline
        name: Включить свет
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/lightbulb-on
        name: Выключить свет
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - 🏠 Главная: index.md
  
  - 🔬 Лаборатория (DIY):
      - 📟 Измерительные приборы: diy/instruments.md
      - 🧠 Проекты на MCU (AVR, PIC, STM): diy/mcu.md
      - 🔌 Программаторы: diy/programmers.md
      
  - 📺 Ремонт ТВ и Мониторов:
      - 🛠 Main-платы & UART логи: tv/main.md
      - 💡 БП & Подсветка: tv/psu.md
      - 💾 Работа с памятью: tv/memory.md
      
  - 💻 Ремонт Ноутбуков:
      - ⚡ Дежурки и Чарджеры: laptops/power.md
      - ⚙️ Прошивка EC-мультов: laptops/ec.md
      
  - ⚙️ Бытовая Техника:
      - 🧺 СМА: appliances/washing-machines.md
      - ❄️ Кондиционеры: appliances/air-conditioners.md
      - 🧊 Холодильники (Обманки): appliances/fridges.md
